[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "context-router"
version = "0.1.0"
description = "Token-efficient, dynamic context routing for LLMs"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Christopher Fleck"},
]
dependencies = [
    "pydantic>=2.0.0",
]

[tool.setuptools.packages.find]
where = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
